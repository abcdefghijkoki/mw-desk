<!doctype html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MW Desk</title>
<meta name="apple-mobile-web-app-title" content="MW Desk">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<style>
:root{--ink:#111827;--sub:#6B7280;--line:#E5E7EB;--soft:#F7F7F8;--btn:#191919}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;color:var(--ink);background:#fff;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
#app.wide{max-width:1240px}
#app.wide>main:not(.dash){max-width:560px;width:100%;margin:0 auto}
#app.wide>.foot{max-width:560px;width:100%;margin:0 auto}
.bar{display:flex;align-items:center;gap:6px;padding:10px 24px;border-bottom:1px solid #EEE;position:sticky;top:0;background:#fff;z-index:2;flex-wrap:wrap}
.bar b{font-size:15px;margin-right:auto}.bar button,.bar a{height:36px;padding:0 14px;border-radius:10px;border:0;background:none;font-size:14px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.bar .on{background:#F1F1EF;font-weight:600}.bar .new{background:var(--btn);color:#fff}
.dash{padding:24px;display:flex;flex-direction:column;gap:20px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{border:1px solid var(--line);border-radius:18px;padding:16px;overflow-x:auto}
.panel h3{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--sub)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:500;color:var(--sub);padding:8px;border-bottom:1px solid var(--line);vertical-align:bottom}
table.t td{padding:10px 8px;border-bottom:1px solid #F3F4F6;overflow-wrap:anywhere}
table.t td.n,table.t td:first-child{white-space:nowrap}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.go{cursor:pointer}table.t tr.go:hover td{background:#FAFAFA}
.pillc{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px}
.ok{background:#DCFCE7;color:#166534}.mid{background:#FEF3C7;color:#92400E}.ng{background:#FDE2E1;color:#B42318}.gray{background:#F3F4F6;color:#4B5563}
.alert{border:1px solid #FDE2E1;background:#FFF5F5;border-radius:14px;padding:12px 16px;font-size:13px;color:#B42318}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.cols{grid-template-columns:1fr}}
header{display:flex;align-items:center;justify-content:space-between;padding:8px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid #EEE;position:sticky;top:0;background:#fff;z-index:2}
header .t{font-size:15px;font-weight:600;text-align:center;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t .s{overflow:hidden;text-overflow:ellipsis}
header .s{font-size:11px;color:var(--sub)}
.icon{width:44px;height:44px;border:0;background:none;font-size:20px;color:var(--ink)}
main{flex:1;padding:20px;display:flex;flex-direction:column;gap:18px}
.foot{padding:12px 20px max(28px,env(safe-area-inset-bottom));border-top:1px solid #EEE;display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;background:#fff}
.btn{height:52px;border-radius:14px;border:0;background:var(--btn);color:#fff;font-size:16px;font-weight:600;width:100%}
.btn:disabled{opacity:.35}
.btn2{height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:14px;width:100%;color:var(--ink)}
.note{font-size:12px;color:var(--sub);text-align:center}
label,.lab{font-size:13px;color:var(--sub);display:block;margin-bottom:6px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;font-family:inherit;color:var(--ink);background:#fff}
textarea{min-height:120px;line-height:1.7}
/* 入力欄の高さをそろえる。iPhoneの日付・日時欄は中身に合わせて広がり、隣の欄にはみ出すので幅を固定する */
input,select{height:48px;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
input[type=checkbox]{height:auto;-webkit-appearance:auto;appearance:auto}
input[type=date],input[type=datetime-local]{display:block;width:100%;text-align:left;line-height:22px}
input::-webkit-date-and-time-value{text-align:left;margin:0}
input::-webkit-datetime-edit{padding:0}
select{background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.row>*{min-width:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink)}
.pill.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button,.seg2 button{height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:14px;color:var(--ink)}
.seg button.on,.seg2 button.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.sw{display:flex;justify-content:space-between;align-items:center;min-height:44px;border-bottom:1px solid #F0F0F0;font-size:14px;color:var(--ink);margin:0}
.sw input{width:auto}
.item{display:block;width:100%;text-align:left;padding:16px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);font-size:15px}
.item small{display:block;color:var(--sub);font-size:12px;margin-top:4px}
.h2{margin:0;font-size:13px;font-weight:500;color:var(--sub);display:flex;justify-content:space-between}
.mrow{position:relative;overflow:hidden;border-radius:10px}.mdel{position:absolute;right:0;top:0;bottom:0;width:80px;border:0;background:#B42318;color:#fff;font-size:14px}
.memo{display:flex;gap:12px;font-size:14px;line-height:1.6;background:#fff;position:relative;padding:6px 0;transition:transform .2s;touch-action:pan-y}.memo span{font-size:12px;color:#9CA3AF;width:36px;flex:none}
.add{display:flex;gap:8px}.add input{flex:1}.add button{width:64px;border-radius:14px;border:0;background:#F3F4F6;font-size:14px}
.drop{display:flex;align-items:center;justify-content:center;height:96px;border:1px dashed #C7CCD4;border-radius:14px;font-size:14px;color:var(--sub);text-align:center;padding:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px}
.deck{position:relative;flex:1;background:#FAFAFA;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y;transition:transform .2s}
.card .co{font-size:12px;color:var(--sub)}.card .nm{font-size:22px;font-weight:700}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:4px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px}.tag.k{background:#F1F1EF;border-color:#F1F1EF;font-weight:600}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:10px 0;border-top:1px solid #F0F0F0;border-bottom:1px solid #F0F0F0;gap:12px}.kv span:first-child{color:var(--sub);flex:none}
.mail{font-size:13px;line-height:1.7;color:#374151;white-space:pre-wrap;max-height:180px;overflow:hidden}
.reason{font-size:12px;color:var(--sub)}
.acts{display:flex;justify-content:center;gap:40px;padding:16px 0 4px}
.round{width:64px;height:64px;border-radius:32px;border:1px solid var(--line);background:#fff;font-size:22px}
.round.ok{background:var(--btn);color:#fff;border:0}
.big{font-size:48px;font-weight:700}
.th{width:44px;height:30px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none;background:#F3F4F6}.crow{background:#fff;position:relative;transition:transform .2s;touch-action:pan-y;cursor:pointer}.crow .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cardimg{width:100%;max-height:260px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:#F9FAFB}
.line{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F0F0F0;font-size:14px;gap:8px}
.line>:first-child{min-width:0;overflow-wrap:anywhere}.line>:last-child:not(:first-child){flex:none}
.line button{height:36px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 12px;font-size:12px}
#sync{position:fixed;top:10px;right:10px;background:#F3F4F6;color:#4B5563;font-size:12px;padding:4px 10px;border-radius:999px;z-index:9;display:none}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#191919;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;display:none;max-width:90%;z-index:9}
.err{color:#B42318;font-size:12px}
.stat{border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.stat span{width:100%;font-size:12px;color:var(--sub)}.stat b{font-size:28px}.stat small{font-size:13px;color:var(--sub)}
.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #EEE;background:#fff;padding:6px 8px 20px}.tabs button{height:48px;border:0;background:none;font-size:14px;color:var(--ink)}
.req::after{content:' ＊';color:#B42318;font-weight:700}
.reqnote{font-size:12px;color:var(--sub)}.reqnote b{color:#B42318}
.up{display:flex;align-items:center;gap:12px;padding:6px 0;font-size:13px}.up img{width:56px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="sync" role="status">保存中…</div>
<script>
// 通信先：Apps Script。画面がGitHub Pagesにあるときは fetch、Apps Script上で開いたときは google.script.run
const API_URL = 'https://mw-desk.miraiway.workers.dev';
const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} } };
let K = store.get('mw_k');
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Googleのログイン情報は送らない（credentials: 'omit'）。本文はtext/plainで送り、余計な事前確認の通信を起こさない
const call = (fn, ...a) => window.google && google.script
  ? new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[fn](...a))
  : fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, args: a }), credentials: 'omit', redirect: 'follow' })
      .catch(() => { throw new Error('通信できませんでした。電波を確認してもう一度お試しください'); })
      .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error); return j.data; });
const run = (fn, ...a) => call(fn, K, ...a).catch(e => { if (/LOGIN/.test(e.message)) { login(); throw new Error('ログインしてください'); } throw e; });
const toast = (m, ms = 3000) => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); };
const fail = e => toast(e.message || String(e), 5000);
const S = { me: '', members: [], events: [], ev: null, contacts: [] };
const SCENE = {'01':'01 挨拶のみ','02':'02 会話','03':'03 関心あり','04':'04 約束あり','05':'05 紹介のお願い'};
const BLOCKS = {'03':{A:'A 全体',B:'B 人材',C:'C 制作',D:'D 日本語教育',E:'E 協業',F:'F 応援'},'04':{'1':'①資料送付','2':'②日程調整','3':'③ご紹介'},'05':{A:'A 全体',B:'B 人材',C:'C 制作',D:'D 日本語教育',E:'E 協業・拡張'}};
const needsSched = c => c.scene === '03' || (c.scene === '04' && c.block === '2');
const jpDate = d => { const x = new Date(d + 'T12:00:00'); return `${x.getMonth()+1}月${x.getDate()}日（${'日月火水木金土'[x.getDay()]}）`; };
let SCR = 0; // 画面を描くたびに増える。古い通信の結果で、もう離れた画面を描き直さないため
const view = (h, wide = false, keepScroll = false) => { SCR++; const a = $('#app'); a.className = wide ? 'wide' : ''; const y = scrollY; a.innerHTML = h; window.scrollTo(0, keepScroll ? y : 0); };

// ── 速さの工夫1：一度見た画面は端末に覚えておき、すぐ表示 → 裏で最新を取って差し替える
const ckey = k => 'c:' + K.slice(0, 8) + ':' + k;
const cget = k => { try { return JSON.parse(localStorage.getItem(ckey(k)) || 'null'); } catch (e) { return null; } };
const cset = (k, v) => { try { localStorage.setItem(ckey(k), JSON.stringify(v)); } catch (e) {} };
const cclear = () => { try { Object.keys(localStorage).filter(k => k.startsWith('c:')).forEach(k => localStorage.removeItem(k)); } catch (e) {} };
// 入力中・取り込み中は描き直さない（打っている文字が消えないように）
const busy = () => { const a = document.activeElement; return (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.value) || UPLOADING; };
let UPLOADING = false;
async function swr(key, fn, args, render, onErr, wide = false) {
  const c = cget(key);
  if (c) render(c, true); else view('<main><p class="note">読み込み中…</p></main>', wide);
  const my = SCR;
  try {
    const v = await run(fn, ...args);
    cset(key, v);
    if (SCR !== my) return v;
    if (!c || JSON.stringify(v) !== JSON.stringify(c)) { if (!c || !busy()) render(v, false); }
    return v;
  } catch (e) { if (!c) onErr(e); else if (!/ログイン/.test(e.message)) toast('最新の内容を取得できませんでした（表示は前回の内容です）'); }
}

// ── 速さの工夫2：書き込みは画面に先に反映し、保存は裏で。失敗したら元に戻して知らせる
let PENDN = 0;
const syncShow = () => { $('#sync').style.display = PENDN ? 'block' : 'none'; };
function bg(p, undo) {
  PENDN++; syncShow();
  return p.catch(e => { fail(e); if (undo) undo(e); }).finally(() => { PENDN--; syncShow(); });
}
window.addEventListener('beforeunload', e => { if (PENDN) { e.preventDefault(); e.returnValue = ''; } });
// 作成直後のイベントへの書き込みは、作成の保存が終わってから送る
const CREATING = {};
const ready = id => CREATING[id] || Promise.resolve();
const cacheEv = () => cset('ev:' + S.ev.id, { ev: S.ev, contacts: S.contacts, total: S.total });
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const WIDE = () => matchMedia('(min-width: 900px)').matches;
// 読み込みに失敗したとき、真っ白にせず「もう一度」を出す
const oops = (e, retry) => view(`<main><p class="err" style="font-size:14px">${esc(e.message || e)}</p><button class="btn2" onclick="${retry}">もう一度読み込む</button></main>`);
const STATUS = { draft: '未承認', approved: '予約済', sent: '送信済' };
const sendDay = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes() < 390 ? '今日' : '明日'; };
const head = (t, s, back) => `<header><button class="icon" aria-label="戻る" onclick="${back || ''}" ${back ? '' : 'style="visibility:hidden"'}>‹</button><div class="t">${esc(t)}${s ? `<div class="s">${esc(s)}</div>` : ''}</div><span style="width:44px"></span></header>`;

// ───── ホーム ─────
// ───── ログイン（名前を選んで暗証番号。この端末に記憶） ─────
async function login() {
  if (K) cclear();
  store.set('mw_k', ''); K = '';
  const code = store.get('mw_c');
  if (!code) return teamCode();
  view('<main><p class="note">読み込み中…</p></main>');
  let names;
  try { names = await call('api_names', code); }
  catch (e) { if (/チームコード/.test(e.message)) { store.set('mw_c', ''); return teamCode(e.message); } return oops(e, 'login()'); }
  view(head('MW Desk') + `<main>
    <div class="h2">あなたはどなたですか？</div>
    ${names.map(n => `<button class="item" onclick="pick(this.textContent)">${esc(n)}</button>`).join('')}
  </main>`);
}
async function pick(name) {
  try {
    K = (await call('api_login', name, store.get('mw_c'))).token;
    store.set('mw_k', K);
    home();
  } catch (e) { fail(e); }
}
// 端末ごとに最初の1回だけ、チーム共通コードを入れる
function teamCode(msg = '') {
  view(head('MW Desk') + `<main>
    <div><label for="tc" class="req">チームコード</label><input id="tc" type="password" autocomplete="off" aria-required="true"></div>
    <span class="note" style="text-align:left">この端末では最初の1回だけです。コードはメンバー内で共有されています</span>
    ${msg ? `<span class="err">${esc(msg)}</span>` : ''}
  </main><div class="foot"><button class="btn" id="go">次へ</button></div>`);
  const go = () => { const v = $('#tc').value.trim(); if (!v) return; store.set('mw_c', v); login(); };
  $('#go').onclick = go;
  $('#tc').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#tc').focus();
}

async function home() {
  if (!K) return login();
  if (WIDE()) return dashboard();
  const v = await swr('home', 'api_init', [], d => { Object.assign(S, d); renderHome(); }, e => K && oops(e, 'home()'));
  if (v) prefetch(v.events);
}
// よく開く上位のイベントを裏で読んでおき、タップした瞬間に開けるようにする
function prefetch(evs) {
  (evs || []).slice(0, 3).forEach((e, i) => setTimeout(() => run('api_getEvent', e.id).then(d => cset('ev:' + e.id, d)).catch(() => {}), 400 * (i + 1)));
}
function renderHome() {
  const sum = S.sum;
  view(head('MW Desk', S.me) + `<main>
    <button class="btn" onclick="newEvent()">＋ イベント作成</button>
    <div class="row">
      <div class="stat"><span>承認待ち</span><b>${sum.drafts}</b><small>件</small></div>
      <div class="stat"><span>期限が近い</span><b>${sum.actions.length}</b><small>件</small></div>
    </div>
    ${sum.actions.length ? `<div><div class="h2">次にやること（7日以内・期限切れ）</div>${sum.actions.map(a => `<div class="line"><span>${a.late ? '<b class="err">期限切れ</b> ' : ''}${esc(a.company)} ${esc(a.name)}<br><small class="note">${esc(a.next)}${a.due ? '・' + esc(a.due) : ''}</small></span><button onclick="actDone('${a.id}')">済にする</button></div>`).join('')}</div>` : ''}
    <div class="h2">自分のイベント</div>
    ${S.events.map(e => `<button class="item" onclick="openEvent('${e.id}')">${esc(e.name)}${sum.draftsBy[e.id] ? ` <span class="tag k">承認待ち ${sum.draftsBy[e.id]}</span>` : ''}<small>${jpDate(e.date)}・${esc(e.members.join('、'))}</small></button>`).join('') || '<p class="note">まだありません</p>'}
  </main><nav class="tabs"><button onclick="contacts()">相手一覧</button><button onclick="settings()">設定</button><button onclick="login()">切り替え</button></nav>`);
}
function actDone(id) {
  const before = S.sum.actions;
  S.sum.actions = before.filter(a => a.id !== id);
  renderHome(); toast('済にしました');
  bg(run('api_actionDone', id).then(sum => { S.sum = sum; cset('home', { me: S.me, members: S.members, events: S.events, sum }); }),
    () => { S.sum.actions = before; renderHome(); });
}

// ───── PC用：上のメニューとダッシュボード ─────
function bar(on) {
  const b = (k, t, fn) => `<button class="${on === k ? 'on' : ''}" onclick="${fn}">${t}</button>`;
  return `<nav class="bar"><b>MW Desk <small class="note">${esc(S.me)}</small></b>
    ${b('dash', 'ダッシュボード', 'home()')}${b('contacts', '相手一覧', 'contacts()')}${b('settings', '設定', 'settings()')}
    ${S.lead ? `<a href="${esc(S.lead)}" target="_blank" rel="noopener">リード表 ↗</a>` : ''}

// ───── イベント（名刺・写真・会場メモ） ─────
function openEvent(id) {
  return swr('ev:' + id, 'api_getEvent', [id], d => { Object.assign(S, d); renderEvent(); }, e => oops(e, `openEvent('${id}')`));
}
function renderEvent(keepScroll = false) {
  const ev = S.ev, cards = S.contacts, id = ev.id;
  const drafts = cards.filter(c => c.status === 'draft').length;
  view(head(ev.name, jpDate(ev.date), 'home()') + `<main>
    ${steps(ev, cards)}
    <div class="h2"><span>名刺・写真</span><span>名刺 ${cards.length}・写真 ${ev.photos}</span></div>
    <label class="drop" for="up" id="dropt">＋ 名刺と写真をまとめて選ぶ<br>（区別しなくてOK）</label>
    <input id="up" type="file" accept="image/*,.heic,.heif" multiple style="display:none">
    <div id="prog"></div>
    ${cards.map(c => `<div class="mrow"><button class="mdel" onclick="delCard('${c.id}')">削除</button><div class="line crow" data-c="${c.id}" onclick="openCard('${c.id}')">${thumb(c, 'th')}<span class="cn">${esc(c.company || '社名未読取')} ${esc(c.name)}</span><span class="tag">${STATUS[c.status]}</span></div></div>`).join('')}
    ${cards.some(c => c.status !== 'draft') ? `<button class="btn2" onclick="done()">送信予約を見る</button>` : ''}
    <div class="h2">会場メモ</div>
    ${ev.memos.map((m, j) => `<div class="mrow"><button class="mdel" onclick="delMemo(${j})">削除</button><div class="memo" data-j="${j}"><span>${esc(m.t)}</span><div>${esc(m.text)}</div></div></div>`).join('')}
    <div class="add"><input id="memo" placeholder="メモを追加（キーボードのマイクで話せます）"><button id="addm">追加</button></div>
  </main><div class="foot">
    <span class="note">${drafts ? `未承認 ${drafts}人。会場メモ ${ev.memos.length}件をもとに、残りを話して仕上げます` : '名刺を取り込むと次に進めます'}</span>
    <button class="btn" ${drafts ? '' : 'disabled'} onclick="talk()">まとめて話して仕上げる</button></div>`, false, keepScroll);
  // 左にスワイプで「削除」ボタンを出す（スワイプだけでは消えない）
  document.querySelectorAll('.memo[data-j], .crow').forEach(row => {
    let x0 = null, dx = 0;
    row.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; dx = 0; row.style.transition = 'none'; }, { passive: true });
    row.addEventListener('touchmove', e => { if (x0 == null) return; dx = Math.min(0, e.touches[0].clientX - x0); row.style.transform = `translateX(${Math.max(dx, -96)}px)`; }, { passive: true });
    row.addEventListener('touchend', () => { row.style.transition = ''; x0 = null; row.style.transform = dx < -48 ? 'translateX(-80px)' : ''; });
  });
  const addMemo = () => {
    const t = $('#memo').value.trim(); if (!t) return;
    const d = new Date(), m = { id: 'tmp' + Date.now(), t: `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`, by: S.me, text: t };
    S.ev.memos.push(m); cacheEv(); renderEvent(true); $('#memo').focus();
    bg(ready(id).then(() => run('api_addMemo', id, t)).then(ms => { S.ev.memos = ms; cacheEv(); }),
      () => { S.ev.memos = S.ev.memos.filter(x => x !== m); renderEvent(true); });
  };
  $('#addm').onclick = addMemo;
  $('#memo').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) addMemo(); };
  $('#up').onchange = async e => {
    const files = [...e.target.files]; if (!files.length) return;
    UPLOADING = true; await ready(id);
    $('#dropt').textContent = `${files.length}枚を取り込み中…（画面を閉じないでください）`;
    $('#prog').innerHTML = files.map((f, j) => `<div class="up"><img src="${URL.createObjectURL(f)}" alt=""><span id="st${j}">待機中</span></div>`).join('');
    let cardsN = 0, photoN = 0, ng = 0, next = 0;
    const one = async j => {
      $('#st' + j).textContent = '読み取り中…';
      try {
        const img = await toB64(files[j]);
        const r = await run('api_upload', id, img.b64, img.mime);
        if (r.type === 'photo') { photoN++; $('#st' + j).textContent = '✓ 会場写真'; }
        else { cardsN++; $('#st' + j).textContent = `✓ 名刺：${r.company || '社名未読取'} ${r.name || ''}`; }
      } catch (err) { ng++; $('#st' + j).textContent = '× 失敗：' + (err.message || err); }
    };
    // 3枚ずつ同時に送る（AI無料枠の回数制限に当たりにくい数）
    await Promise.all([0, 1, 2].map(async () => { while (next < files.length) await one(next++); }));
    UPLOADING = false;
    toast(`名刺 ${cardsN}枚・写真 ${photoN}枚を保存しました${ng ? `（失敗 ${ng}枚）` : ''}`, 4000);
    setTimeout(() => openEvent(id), 1200);
  };
}

// オンにした機能だけを上から順に並べる
function steps(ev, cards) {
  const st = [];
  if (ev.slack) st.push(ev.slackTs ? ['Slack親投稿', '投稿済み', ''] : ['Slack親投稿', '内容を確認して投稿', 'parent()']);
  if (ev.sokuho) st.push(ev.sokuho.by ? ['速報', `${esc(ev.sokuho.by)}さんが投稿済み`, ''] : ['速報', ev.slackTs ? '写真と選択式で投稿' : '親投稿のあとで出せます', ev.slackTs ? 'sokuho()' : '']);
  const rep = (ev.reports || {})[S.me];
  st.push(['終了報告', rep ? '提出済み（直せます）' : cards.some(c => c.status === 'draft') ? 'メールの承認が終わったら' : '数字は自動。所感を話すだけ', 'report()']);
  return `<div class="h2">ステップ</div>` + st.map(([t, d, fn]) => fn
    ? `<button class="item" onclick="${fn}">${t}<small>${d}</small></button>`
    : `<div class="item" style="color:var(--sub)">${t}<small>${d}</small></div>`).join('');
}

// 名刺の画像（Cloudflareから直接読む。ブラウザが覚えるので2回目からは一瞬）
const thumb = (c, cls) => c.fileKey ? `<img class="${cls}" loading="lazy" alt="名刺" src="${API_URL}?img=${encodeURIComponent(c.fileKey)}&k=${K}">` : `<span class="${cls}"></span>`;
function openCard(id) {

function delCard(id) {

async function reread() {

function delMemo(j) {
  const id = S.ev.id, before = S.ev.memos.slice(), m = before[j];
  S.ev.memos.splice(j, 1); cacheEv(); renderEvent(true); toast('メモを削除しました');
  bg(ready(id).then(() => run('api_deleteMemo', id, m)).then(ms => { S.ev.memos = ms; cacheEv(); }),
    () => { S.ev.memos = before; renderEvent(true); });
}

// 送る前に縮小（長辺1280px）して通信量とAIの負担を減らす
async function toB64(file) {
  try {
    const img = await createImageBitmap(file);
    const r = Math.min(1, 1280 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = img.width * r; c.height = img.height * r;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return { b64: c.toDataURL('image/jpeg', 0.8).split(',')[1], mime: 'image/jpeg' };
  } catch (e) {
    // このブラウザで開けない形式（HEICなど）はそのまま送る。AIもDriveもHEICを扱える
    if (file.size > 15e6) throw new Error('画像が大きすぎます（15MBまで）');
    const b64 = await new Promise((ok, ng) => { const fr = new FileReader(); fr.onload = () => ok(fr.result.split(',')[1]); fr.onerror = ng; fr.readAsDataURL(file); });
    const heic = /\.hei[cf]$/i.test(file.name) || /hei[cf]/.test(file.type);
    return { b64, mime: heic ? 'image/heic' : (file.type || 'image/jpeg') };
  }
}

// ───── スワイプで承認 ─────
function swipe() {
  BACK = swipe;
  const ev = S.ev, all = S.contacts, q = all.filter(c => c.status === 'draft');
  if (!q.length) return done();
  const c = q[0], i = all.length - q.length + 1;
  const sched = needsSched(c) ? `<div><span class="lab">日程</span><div class="seg2">
      <button class="${c.schedMode !== 'ask' ? 'on' : ''}" onclick="setSched('dates')">候補日を送る</button>
      <button class="${c.schedMode === 'ask' ? 'on' : ''}" onclick="setSched('ask')">日程を聞く</button></div>
      ${c.schedMode !== 'ask' ? [0,1,2].map(j => `<label class="lab" style="margin:10px 0 4px" for="dt${j}">候補${j + 1}</label><input type="datetime-local" id="dt${j}" data-j="${j}" value="${esc((c.dtRaw || [])[j] || '')}" onchange="setDate()">`).join('') : ''}</div>` : '';
  view(head('確認と承認', `${i}/${all.length}`, `openEvent('${ev.id}')`) + `
    <div style="height:3px;background:#EEE"><div style="width:${(i - 1) / all.length * 100}%;height:3px;background:#191919"></div></div>
    <div class="deck"><article class="card" id="card">
      <div><div class="co">${esc(c.company)}${c.dept ? '・' + esc(c.dept) : ''}${c.title ? '・' + esc(c.title) : ''}</div><div class="nm">${esc(c.name || '（氏名未読取）')} 様</div></div>
      <div class="tags"><span class="tag k">${esc(SCENE[c.scene])}${c.block ? '・' + esc((BLOCKS[c.scene] || {})[c.block] || '') : ''}</span>
        ${c.biz && c.biz !== 'なし' ? `<span class="tag">${esc(c.biz)}事業</span>` : ''}${c.deep ? '<span class="tag">深く話せた</span>' : ''}${(c.reunion || []).length ? '<span class="tag">再会</span>' : ''}</div>
      ${c.note ? `<p style="margin:0;font-size:14px;line-height:1.7;color:#374151">${esc(c.note)}</p>` : ''}
      ${c.next && c.next !== 'なし' ? `<div class="kv"><span>次にやること</span><span>${esc(c.next)}${c.due ? '・' + esc(c.due) + 'まで' : ''}</span></div>` : ''}
      ${sched}
      <div><span class="lab">メール（宛先 ${esc(c.email || '未読取')}・${sendDay()} 6:30 送信）</span><div class="mail">件名：${esc(c.subject)}\n\n${esc(c.body)}</div></div>
      ${c.reason ? `<div class="reason">AIの判断：${esc(c.reason)}</div>` : ''}
      ${/〇/.test(c.subject + c.body) ? '<div class="err">「〇〇」が残っています。「全文を見る・直す」で埋めてください</div>' : ''}
      <button class="btn2" onclick="edit()">全文を見る・直す</button>
    </article></div>
    <div class="foot" style="border:0;background:#FAFAFA"><div class="acts">
      <button class="round" aria-label="直す" onclick="edit()">✎</button>
      <button class="round ok" aria-label="承認" onclick="approve()">✓</button></div>
      <span class="note">← 直す　　右にスワイプで承認 →</span></div>`);
  window.C = c;
  // 横にはっきり動かしたときだけスワイプとみなす（縦スクロール中の誤承認を防ぐ）。入力欄の上では反応しない
  const card = $('#card'); let x0 = null, y0 = 0, dx = 0, dy = 0;
  card.addEventListener('touchstart', e => { if (e.target.closest('input,textarea,select,button')) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = dy = 0; card.style.transition = 'none'; }, { passive: true });
  card.addEventListener('touchmove', e => { if (x0 == null) return; dx = e.touches[0].clientX - x0; dy = e.touches[0].clientY - y0; if (Math.abs(dx) > Math.abs(dy)) card.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`; }, { passive: true });
  card.addEventListener('touchend', () => {
    if (x0 == null) return;
    card.style.transition = ''; x0 = null;
    const sideways = Math.abs(dx) > 2 * Math.abs(dy);
    if (sideways && dx > 110) approve(); else if (sideways && dx < -110) { card.style.transform = ''; edit(); } else card.style.transform = '';
  });
}

async function saveC(patch) {
  try {
    const c = await run('api_updateContact', Object.assign({ id: C.id }, patch));
    S.contacts = S.contacts.map(x => x.id === c.id ? c : x);
  } catch (e) { fail(e); }
}
async function setSched(m) { await saveC({ schedMode: m }); swipe(); }
async function setDate() {
  const raw = [...document.querySelectorAll('[data-j]')].map(i => i.value);
  const fmt = v => { const d = new Date(v), e = new Date(d.getTime() + 30 * 6e4), hm = x => `${x.getHours()}:${String(x.getMinutes()).padStart(2, '0')}`;
    return `${d.getMonth() + 1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）${hm(d)}〜${hm(e)}`; };
  await saveC({ dates: raw.filter(Boolean).map(fmt), dtRaw: raw });
  swipe();
}

const PEND = [];
async function approve() {
  const c = C, card = $('#card');
  const err = !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email || '') ? 'メールアドレスを確認してください'
    : /〇/.test(c.subject + c.body) ? '「〇〇」が残っています。直してから承認してください' : '';
  if (err) { if (card) card.style.transform = ''; return fail(new Error(err)); }
  c.status = 'approved'; cacheEv();
  const p = run('api_approve', c.id).catch(e => { c.status = 'draft'; fail(e); if ($('#card') || $('.big')) swipe(); });
  PEND.push(p);
  if (card) { card.style.transform = 'translateX(120%) rotate(12deg)'; await new Promise(r => setTimeout(r, 160)); }
  swipe();
}

// ───── 直す ─────
let BACK = swipe; // 「直す」から戻る先（承認カード or イベント画面）
function edit() {
  const c = C, sc = Object.keys(SCENE), bl = BLOCKS[c.scene] || {};
  view(head('直す', c.company + ' ' + c.name, 'BACK()') + `<main>
    ${c.fileKey ? `${thumb(c, 'cardimg')}<button class="btn2" id="rr" onclick="reread()">AIでもう一度読み取る</button>` : ''}
    <div class="row"><div><label for="sc">シーン</label><select id="sc">${sc.map(s => `<option value="${s}" ${s === c.scene ? 'selected' : ''}>${SCENE[s]}</option>`).join('')}</select></div>
      <div><label for="bl">ブロック</label><select id="bl" ${Object.keys(bl).length ? '' : 'disabled'}><option value="">—</option>${Object.entries(bl).map(([k, v]) => `<option value="${k}" ${k === c.block ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
    <div><label for="co">社名</label><input id="co" value="${esc(c.company)}"></div>
    <div><label for="dp">部署</label><input id="dp" value="${esc(c.dept)}"></div>
    <div class="row"><div><label for="nm">氏名</label><input id="nm" value="${esc(c.name)}"></div><div><label for="ti">役職</label><input id="ti" value="${esc(c.title)}"></div></div>
    <div><label for="em" class="req">メールアドレス</label><input id="em" type="email" value="${esc(c.email)}"></div>
    <div><label for="sj">件名</label><input id="sj" value="${esc(c.subject)}"></div>
    <div><label for="bd">本文（直接直すと、以後は自動で組み直しません）</label><textarea id="bd" style="min-height:420px">${esc(c.body)}</textarea></div>
  </main><div class="foot"><button class="btn" id="sv">保存して戻る</button></div>`);
  let touched = !!c.edited;
  $('#sj').oninput = $('#bd').oninput = () => touched = true;
  $('#sc').onchange = () => { C.scene = $('#sc').value; C.block = ''; saveFields(false).then(edit); };
  $('#bl').onchange = () => { C.block = $('#bl').value; saveFields(false).then(edit); };
  $('#sv').onclick = () => saveFields(touched).then(() => BACK());
}
function saveFields(edited) {
  return saveC({ scene: C.scene, block: C.block, company: $('#co').value, name: $('#nm').value, dept: $('#dp').value, title: $('#ti').value,
    email: $('#em').value.trim(), subject: $('#sj').value, body: $('#bd').value, edited })
    .then(() => { C = S.contacts.find(x => x.id === C.id); });
}

// ───── 送信予約の完了 ─────
function done() {
  const ev = S.ev, ap = S.contacts.filter(c => c.status === 'approved'), sent = S.contacts.filter(c => c.status === 'sent');
  if (PEND.length) Promise.allSettled(PEND.splice(0)).then(() => run('api_organizeSoon').catch(() => {}));
  const by = {}; ap.forEach(c => by[c.scene] = (by[c.scene] || 0) + 1);
  view(head(ev.name, '', `openEvent('${ev.id}')`) + `<main>
    <div><span class="note" style="text-align:left;display:block">${sendDay()} 6:30 に送信します</span>
      <p style="margin:4px 0"><span class="big">${ap.length}</span> <b>件のメールを予約しました</b></p>
      <span class="note" style="text-align:left;display:block">送信前ならいつでも取り消し・修正できます</span></div>
    <div><div class="h2">内訳</div>${Object.keys(by).sort().map(s => `<div class="line"><span>${SCENE[s]}</span><span>${by[s]}</span></div>`).join('')}</div>
    <div><div class="h2">予約中</div>${ap.map(c => `<div class="line"><span>${esc(c.company)} ${esc(c.name)}</span><button onclick="cancelC('${c.id}')">取り消して直す</button></div>`).join('')}</div>
    ${sent.length ? `<span class="note">送信済み ${sent.length}件</span>` : ''}
    <span class="note">名刺 ${S.contacts.length}枚・写真 ${ev.photos}枚は、まもなく Drive のイベントフォルダに整理されます</span>
  </main><div class="foot"><button class="btn" onclick="report()">終了報告を仕上げる</button><button class="btn2" onclick="home()">ホームへ</button></div>`);
}
function cancelC(id) {
  const c = S.contacts.find(x => x.id === id);
  c.status = 'draft'; cacheEv(); swipe();
  bg(run('api_cancel', id), () => { c.status = 'approved'; });
}

home();

<!doctype html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MW Desk</title>
<meta name="apple-mobile-web-app-title" content="MW Desk">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
/* MW Desk の見た目（iOS 純正アプリの作法：意味で決めた色・グループリスト・すりガラス・控えめな動き）
 */
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--ink:#000000;--sub:#6C6C70;--ter:#AEAEB2;--line:rgba(60,60,67,.14);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);
  --tint:#007AFF;--tintbg:rgba(0,122,255,.12);--green:#34C759;--orange:#FF9500;--red:#FF3B30;
  --okt:#1F7A37;--midt:#A85400;--ngt:#C4180F;
  --glass:rgba(249,249,251,.78);--glassline:rgba(60,60,67,.16);--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --soft:var(--bg);--btn:var(--tint);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000;--card:#1C1C1E;--ink:#FFFFFF;--sub:#98989F;--ter:#636366;--line:rgba(84,84,88,.55);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);
  --tint:#0A84FF;--tintbg:rgba(10,132,255,.2);--green:#30D158;--orange:#FF9F0A;--red:#FF453A;
  --okt:#4CD964;--midt:#FFB340;--ngt:#FF6961;
  --glass:rgba(22,22,24,.74);--glassline:rgba(255,255,255,.1);--shadow:0 0 0 1px rgba(255,255,255,.04);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Hiragino Sans','Noto Sans JP',sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font-family:inherit;color:inherit;cursor:pointer;transition:transform .15s ease,opacity .15s ease,background-color .2s ease}
button:active:not(:disabled){transform:scale(.97);opacity:.7}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#app.wide{max-width:1240px}
#app.enter>main,#app.enter>.dash,#app.enter>.deck{animation:enter .32s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* パソコンでスマホ画面を見せる（プレゼン用） */
body.phone{background:#0B0B0F;display:flex;align-items:center;justify-content:center;min-height:100vh}
body.phone #app{width:390px;max-width:390px;height:844px;max-height:94vh;min-height:0;margin:0;overflow-y:auto;border-radius:52px;border:12px solid #1C1C21;outline:2px solid #3A3A44;box-shadow:0 40px 120px rgba(0,122,255,.25);background:var(--bg);transform:translateZ(0)}
body.phone #app::-webkit-scrollbar{display:none}
#pcback{display:none}
body.phone #pcback{display:block;position:fixed;top:20px;left:20px;border:1px solid #3A3A44;background:#1C1C21;color:#E5E7EB;border-radius:999px;padding:10px 18px;font-size:14px}

/* ナビゲーションバー（すりガラス） */
header,.bar,.foot{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;padding-top:max(4px,env(safe-area-inset-top));border-bottom:.5px solid var(--glassline);position:sticky;top:0;z-index:3;min-height:52px}
header .t{font-size:17px;font-weight:600;text-align:center;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .s{font-size:11px;font-weight:400;color:var(--sub);overflow:hidden;text-overflow:ellipsis}
.icon{width:44px;height:44px;border:0;background:none;color:var(--tint);display:flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:22px;height:22px;flex:none;margin-left:-4px}
.icon .bk{font-size:17px;font-weight:400;letter-spacing:0}
header .icon{width:auto;min-width:44px;padding:0 6px;gap:0}
header>span{width:72px!important}
svg[viewBox]{flex:none}
/* 大きなタイトル（タブの最上位の画面） */
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:max(20px,calc(env(safe-area-inset-top) + 12px)) 20px 4px}
.lt small{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:2px}
.lt h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.avatar{width:40px;height:40px;border-radius:20px;border:0;background:linear-gradient(145deg,#5AC8FA,#007AFF);color:#fff;font-size:16px;font-weight:700;flex:none;margin-bottom:4px}

main{flex:1;padding:16px;display:flex;flex-direction:column;gap:20px}
.foot{padding:12px 16px max(20px,env(safe-area-inset-bottom));border-top:.5px solid var(--glassline);display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;z-index:2}

/* タブバー（浮かぶガラスのカプセル） */
.tabs{position:sticky;bottom:max(14px,env(safe-area-inset-bottom));z-index:3;margin:0 auto 14px;display:grid;grid-template-columns:repeat(3,92px);gap:2px;padding:5px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:saturate(200%) blur(24px);backdrop-filter:saturate(200%) blur(24px);border:.5px solid var(--glassline);box-shadow:0 8px 30px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.35)}
.tabs button{height:52px;border:0;background:none;border-radius:999px;font-size:10px;font-weight:600;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button svg{width:24px;height:24px}
#app.edge{transition:none;box-shadow:-12px 0 30px rgba(0,0,0,.18)}
#app.edgeback{transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.tabs button.on{color:var(--tint);background:var(--fill)}

/* ボタン */
.btn{height:50px;border-radius:14px;border:0;background:var(--tint);color:#fff;font-size:17px;font-weight:600;width:100%}
.btn:disabled{opacity:.4}
.btn2{height:50px;border-radius:14px;border:0;background:var(--fill);font-size:17px;font-weight:500;width:100%;color:var(--tint)}
.note{font-size:13px;color:var(--sub);text-align:center}
.err{color:var(--red);font-size:13px}
.ver{margin:4px 0 0;text-align:center;font-size:11px;color:var(--ter);letter-spacing:.04em}

/* 入力 */
label,.lab{font-size:13px;color:var(--sub);display:block;margin:0 0 6px 4px}
input,textarea,select{width:100%;border:0;border-radius:12px;padding:12px 14px;font-size:17px;font-family:inherit;color:var(--ink);background:var(--card);outline:0;transition:box-shadow .2s ease}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 3px var(--tintbg),0 0 0 1px var(--tint)}
input::placeholder,textarea::placeholder{color:var(--ter)}
textarea{min-height:120px;line-height:1.6}
/* 入力欄の高さをそろえる。iPhoneの日付・日時欄は中身に合わせて広がり、隣の欄にはみ出すので幅を固定する */
input,select{height:48px;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
input[type=checkbox]{height:auto;width:auto;-webkit-appearance:auto;appearance:auto;accent-color:var(--tint)}
input[type=search]{background:var(--fill);height:40px;border-radius:11px;font-size:16px}
input[type=date],input[type=datetime-local]{display:block;width:100%;text-align:left;line-height:22px}
input::-webkit-date-and-time-value{text-align:left;margin:0}
input::-webkit-datetime-edit{padding:0}
select{background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.row>*{min-width:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.req::after{content:' ＊';color:var(--red);font-weight:700}
.reqnote{font-size:13px;color:var(--sub)}.reqnote b{color:var(--red)}

/* 選択（チップ・セグメント） */
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:36px;padding:0 14px;border-radius:999px;border:0;background:var(--card);font-size:15px;color:var(--ink)}
.pill.on{background:var(--tint);color:#fff}
.seg,.seg2{display:grid;gap:0;background:var(--fill);padding:2px;border-radius:10px}
.seg{grid-template-columns:repeat(3,1fr)}.seg2{grid-template-columns:1fr 1fr}
.seg button,.seg2 button{height:36px;border-radius:8px;border:0;background:none;font-size:14px;font-weight:500;color:var(--ink)}
.seg button.on,.seg2 button.on{background:var(--card);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){.seg button.on,.seg2 button.on{background:#636366}}
.sw{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:.5px solid var(--line);font-size:17px;color:var(--ink);margin:0}
.sw input[type=checkbox]{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none;padding:0;transition:background-color .25s ease;cursor:pointer}
.sw input[type=checkbox]::after{content:'';position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sw input[type=checkbox]:checked{background:var(--green)}.sw input[type=checkbox]:checked::after{transform:translateX(20px)}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px 4px;background:var(--card);border-radius:14px;padding:14px 8px;box-shadow:var(--shadow)}
.sw-c{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0;font-size:11px;color:var(--sub);white-space:nowrap;letter-spacing:-.04em}
.sw-c i{width:34px;height:34px;border-radius:17px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:box-shadow .2s ease,transform .2s ease}
.sw-c.on{color:var(--ink);font-weight:600}.sw-c.on i{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--tint);transform:scale(.92)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;padding:6px 12px;background:var(--card);border-radius:999px;font-size:14px}

/* リスト */
.h2{margin:4px 4px -8px;font-size:20px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:-.01em}
.h2 span+span{font-size:13px;font-weight:400;color:var(--sub)}
.h2+.mail,.h2+p,.h2+.line{margin-top:6px}
.item{position:relative;display:block;width:100%;text-align:left;padding:14px 40px 14px 16px;border:0;border-radius:14px;background:var(--card);color:var(--ink);font-size:17px;font-weight:500;box-shadow:var(--shadow);line-height:1.35}
button.item::after{content:'';position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid var(--ter);border-top:2px solid var(--ter);transform:translateY(-50%) rotate(45deg)}
.item small{display:block;color:var(--sub);font-size:13px;font-weight:400;margin-top:3px}
div.item{box-shadow:none;background:var(--fill)}
main>.item+.item,#list>.item+.item,#llist>.item+.item{margin-top:-10px}
#list,#llist{display:flex;flex-direction:column;gap:20px}
.line{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:.5px solid var(--line);font-size:16px;gap:10px}
.line>:first-child{min-width:0;overflow-wrap:anywhere}.line>:last-child:not(:first-child){flex:none}
.line button{height:34px;border-radius:999px;border:0;background:var(--fill);color:var(--tint);padding:0 14px;font-size:14px;font-weight:500}
.kv{display:flex;justify-content:space-between;font-size:15px;padding:12px 0;border-top:.5px solid var(--line);border-bottom:.5px solid var(--line);gap:12px}.kv span:first-child{color:var(--sub);flex:none}

/* 名刺の一覧（1つのグループにまとめる） */
#cards{background:var(--card);border-radius:14px;padding:0 14px;box-shadow:var(--shadow);overflow:hidden}
#cards:empty{display:none}
#cards .line:last-child,#cards .mrow:last-child .line{border-bottom:0}
.mrow{position:relative;overflow:hidden}.mdel{position:absolute;right:-14px;top:0;bottom:0;width:94px;border:0;background:var(--red);color:#fff;font-size:15px;font-weight:500;visibility:hidden}
.th{width:48px;height:32px;object-fit:cover;border-radius:6px;flex:none;background:var(--fill)}
.crow{background:var(--card);position:relative;transition:transform .25s cubic-bezier(.2,.8,.2,1);touch-action:pan-y;cursor:pointer}
.crow .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.cardimg{width:100%;max-height:260px;object-fit:contain;border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.memo{display:flex;gap:12px;font-size:16px;line-height:1.5;background:var(--bg);position:relative;padding:8px 0;transition:transform .25s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}.memo span{font-size:13px;color:var(--ter);width:40px;flex:none;padding-top:2px}
.add{display:flex;gap:8px}.add input{flex:1}.add button{width:64px;border-radius:12px;border:0;background:var(--fill);color:var(--tint);font-size:16px;font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:4px 10px;border-radius:999px;background:var(--fill);font-size:12px;font-weight:500;color:var(--sub)}.tag.k{background:var(--tintbg);color:var(--tint);font-weight:600}

/* 取り込み（タップする場所と、読み取り中のカード） */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;border:1.5px dashed color-mix(in srgb,var(--tint) 45%,transparent);border-radius:16px;background:var(--tintbg);font-size:15px;font-weight:600;color:var(--tint);text-align:center;padding:14px;margin:0;cursor:pointer;transition:background-color .2s}
.drop small{font-size:12px;font-weight:400;color:var(--sub)}
.drop svg{width:30px;height:30px}
.drop.busy{border:0;background:var(--card);box-shadow:var(--shadow);flex-direction:row;justify-content:flex-start;gap:14px;text-align:left;color:var(--ink);padding:14px 16px}
.drop.busy>span{flex:1;min-width:0}
.spin{width:34px;height:34px;flex:none;border-radius:50%;border:3.5px solid var(--fill2);border-top-color:var(--tint);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{height:5px;border-radius:3px;background:var(--fill2);overflow:hidden;margin-top:8px}.prog i{display:block;height:5px;border-radius:3px;background:var(--tint);width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.shim{display:inline-block;width:62%;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--fill) 0%,var(--fill2) 45%,var(--fill) 90%);background-size:200% 100%;animation:shim 1.3s linear infinite;vertical-align:middle}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.up-run .th{opacity:.55}.up-ng .cn{color:var(--red)}
@keyframes flash{from{background:var(--tintbg)}to{background:var(--card)}}.up-done{animation:flash 1.4s ease-out}
.up{display:flex;align-items:center;gap:12px;padding:6px 0;font-size:13px}.up img{width:56px;height:40px;object-fit:cover;border-radius:8px;flex:none}

/* ホーム */
.stat{font:inherit;text-align:left;background:var(--card);color:inherit;border:0;border-radius:16px;padding:14px 16px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;box-shadow:var(--shadow)}
.stat span{width:100%;font-size:13px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:6px}
.stat span::before{content:'';width:8px;height:8px;border-radius:4px;background:var(--ter)}
.stat b{font-size:34px;font-weight:700;letter-spacing:-.02em;font-feature-settings:'tnum'}.stat small{font-size:15px;color:var(--sub)}
.stat.hot span::before{background:var(--orange)}.stat.hot:first-child span::before{background:var(--tint)}
.todo{background:var(--card);border-radius:16px;padding:14px 16px 4px;scroll-margin-top:80px;box-shadow:var(--shadow)}
.todo h3{margin:0 0 4px;font-size:20px;font-weight:700;display:flex;align-items:baseline;gap:8px}.todo h3 small{font-size:13px;color:var(--sub);font-weight:400}
.titem{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:.5px solid var(--line)}.titem:first-of-type{border-top:0}
.titem .due{flex:none;font-size:12px;font-weight:700;color:var(--midt);background:color-mix(in srgb,var(--orange) 16%,transparent);border-radius:8px;padding:4px 8px}
.titem .due.late{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--ngt)}
.titem .tbody{flex:1;min-width:0;font-size:14px;line-height:1.4;color:var(--sub);cursor:pointer}.titem .tbody b{display:block;font-size:16px;font-weight:600;color:var(--ink)}
.titem button{flex:none;border:0;background:var(--fill);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;color:var(--tint)}

/* 確認と承認 */
.deck{position:relative;flex:1;padding:16px}
.card{background:var(--card);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y;transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 6px rgba(0,0,0,.05),0 14px 40px rgba(0,0,0,.09)}
.card .co{font-size:13px;color:var(--sub)}.card .nm{font-size:26px;font-weight:700;letter-spacing:-.02em}
.card .lab{margin-left:0}
.mail{font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-wrap;max-height:180px;overflow:hidden;background:var(--fill);border-radius:12px;padding:12px 14px;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.reason{font-size:13px;color:var(--sub)}
.acts{display:flex;justify-content:center;gap:44px;padding:8px 0 4px}
.round{width:64px;height:64px;border-radius:32px;border:0;background:var(--fill2);color:var(--ink);display:flex;align-items:center;justify-content:center}
.round svg{width:28px;height:28px}
.round.ok{background:var(--green);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--green) 45%,transparent)}
.big{font-size:56px;font-weight:700;letter-spacing:-.03em;font-feature-settings:'tnum'}
.steps{height:4px;background:var(--fill2)}.steps i{display:block;height:4px;background:var(--tint);border-radius:0 2px 2px 0;transition:width .4s cubic-bezier(.2,.8,.2,1)}

/* お知らせ */
#sync{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--sub);font-size:12px;padding:5px 12px;border-radius:999px;z-index:9;display:none;border:.5px solid var(--glassline)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(44,44,46,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:11px 18px;border-radius:999px;font-size:15px;font-weight:500;display:none;max-width:90%;z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:enter .25s cubic-bezier(.2,.8,.2,1);text-align:center}
.alert{background:color-mix(in srgb,var(--red) 10%,var(--card));border-radius:14px;padding:12px 16px;font-size:14px;color:var(--ngt)}
.pillc{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--okt)}.mid{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--midt)}.ng{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--ngt)}.gray{background:var(--fill);color:var(--sub)}

/* パソコン */
#app.wide>main:not(.dash){max-width:560px;width:100%;margin:0 auto}
#app.wide>.foot{max-width:560px;width:100%;margin:0 auto;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;border:0}
.bar{display:flex;align-items:center;gap:4px;padding:10px 24px;border-bottom:.5px solid var(--glassline);position:sticky;top:0;z-index:3;flex-wrap:wrap}
.bar b{font-size:17px;font-weight:700;margin-right:auto}.bar b small{font-weight:400}
.bar button,.bar a{height:34px;padding:0 14px;border-radius:999px;border:0;background:none;font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.bar .on{background:var(--fill);font-weight:600}.bar .new{background:var(--tint);color:#fff;font-weight:600}
.dash{padding:24px;display:flex;flex-direction:column;gap:20px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--card);border-radius:18px;padding:18px;overflow-x:auto;box-shadow:var(--shadow)}
.panel h3{margin:0 0 10px;font-size:17px;font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;font-weight:600;color:var(--sub);padding:8px;border-bottom:.5px solid var(--line);vertical-align:bottom}
table.t td{padding:11px 8px;border-bottom:.5px solid var(--line);overflow-wrap:anywhere}
table.t tr:last-child td{border-bottom:0}
table.t td.n,table.t td:first-child{white-space:nowrap}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.go{cursor:pointer}table.t tr.go:hover td{background:var(--fill)}
table.t input,table.t select{background:var(--fill)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.cols{grid-template-columns:1fr}}
</style>

<body>
<button id="pcback" onclick="phoneMode(false)">← パソコン表示に戻る</button>
<div id="app"></div>
<div id="toast"></div>
<div id="sync" role="status">保存中…</div>
<script>
// 通信先：Apps Script。画面がGitHub Pagesにあるときは fetch、Apps Script上で開いたときは google.script.run
// バージョン：直したら上げる（大きな機能追加は 1.x、小さな修正は 1.0.x）
const VERSION = '2.1.0';
const ver = () => `<p class="ver">MW Desk v${VERSION}</p>`;
const API_URL = 'https://mw-desk.miraiway.workers.dev';
const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} } };
let K = store.get('mw_k');
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Googleのログイン情報は送らない（credentials: 'omit'）。本文はtext/plainで送り、余計な事前確認の通信を起こさない
const call = (fn, ...a) => window.google && google.script
  ? new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[fn](...a))
  : fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, args: a }), credentials: 'omit', redirect: 'follow' })
      .catch(() => { throw new Error('通信できませんでした。電波を確認してもう一度お試しください'); })
      .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error); return j.data; });
const run = (fn, ...a) => call(fn, K, ...a).catch(e => { if (/LOGIN/.test(e.message)) { login(); throw new Error('ログインしてください'); } throw e; });
const toast = (m, ms = 3000) => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); };
const fail = e => toast(e.message || String(e), 5000);
const S = { me: '', members: [], events: [], ev: null, contacts: [] };
const SCENE = {'01':'01 挨拶のみ','02':'02 会話','03':'03 関心あり','04':'04 約束あり','05':'05 紹介のお願い'};
const BLOCKS = {'03':{A:'A 全体',B:'B 人材',C:'C 制作',D:'D 日本語教育',E:'E 協業',F:'F 応援'},'04':{'1':'①資料送付','2':'②日程調整','3':'③ご紹介'},'05':{A:'A 全体',B:'B 人材',C:'C 制作',D:'D 日本語教育',E:'E 協業・拡張'}};
const needsSched = c => c.scene === '03' || (c.scene === '04' && c.block === '2');
const jpDate = d => { const x = new Date(d + 'T12:00:00'); return `${x.getMonth()+1}月${x.getDate()}日（${'日月火水木金土'[x.getDay()]}）`; };
let SCR = 0; // 画面を描くたびに増える。古い通信の結果で、もう離れた画面を描き直さないため
let LASTV = 0, POPPING = false;
// 下の階層の画面（左上に「戻る」がある画面）を開いたら履歴を1つ積む。ホームなど最上位の画面では積まない
// 履歴は最大2段（最上位 → 下の階層）。ブラウザの「戻る」は、左上の「戻る」と同じ動きになる
function syncHistory(keepScroll) {
  if (keepScroll) return;
  const sub = !!document.querySelector('header .icon[aria-label="戻る"]:not([style*="hidden"])');
  const cur = (history.state || {}).mw;
  try {
    if (sub) { if (cur === 'sub') history.replaceState({ mw: 'sub' }, ''); else history.pushState({ mw: 'sub' }, ''); }
    else if (cur === 'sub' && !POPPING) { POPPING = 'skip'; history.back(); }
    else history.replaceState({ mw: 'top' }, '');
  } catch (e) {}
}
addEventListener('popstate', () => {
  if (POPPING === 'skip') { POPPING = false; return; } // 最上位に戻ったときに履歴を整えただけ
  const b = document.querySelector('header .icon[aria-label="戻る"]:not([style*="hidden"])');
  if (b) { POPPING = true; b.click(); POPPING = false; }
});
const view = (h, wide = false, keepScroll = false) => { SCR++; const a = $('#app'), now = Date.now(); a.className = (wide ? 'wide' : '') + (!keepScroll && now - LASTV > 700 ? ' enter' : ''); LASTV = now; const y = scrollY, ay = a.scrollTop; a.innerHTML = h; window.scrollTo(0, keepScroll ? y : 0); a.scrollTop = keepScroll ? ay : 0;  syncHistory(keepScroll); };

// ── 速さの工夫1：一度見た画面は端末に覚えておき、すぐ表示 → 裏で最新を取って差し替える
const ckey = k => 'c:' + K.slice(0, 8) + ':' + k;
const cget = k => { try { return JSON.parse(localStorage.getItem(ckey(k)) || 'null'); } catch (e) { return null; } };
const cset = (k, v) => { try { localStorage.setItem(ckey(k), JSON.stringify(v)); } catch (e) {} };
const cclear = () => { try { Object.keys(localStorage).filter(k => k.startsWith('c:')).forEach(k => localStorage.removeItem(k)); } catch (e) {} };
// 入力中・取り込み中は描き直さない（打っている文字が消えないように）
const busy = () => { const a = document.activeElement; return (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.value) || UPLOADING; };
let UPLOADING = false;
async function swr(key, fn, args, render, onErr, wide = false) {
  const c = cget(key);
  if (c) render(c, true); else view('<main><p class="note">読み込み中…</p></main>', wide);
  const my = SCR;
  try {
    const v = await run(fn, ...args);
    cset(key, v);
    if (SCR !== my) return v;
    if (!c || JSON.stringify(v) !== JSON.stringify(c)) { if (!c || !busy()) render(v, false); }
    return v;
  } catch (e) { if (!c) onErr(e); else if (!/ログイン/.test(e.message)) toast('最新の内容を取得できませんでした（表示は前回の内容です）'); }
}

// ── 速さの工夫2：書き込みは画面に先に反映し、保存は裏で。失敗したら元に戻して知らせる
let PENDN = 0;
const syncShow = () => { $('#sync').style.display = PENDN ? 'block' : 'none'; };
function bg(p, undo) {
  PENDN++; syncShow();
  return p.catch(e => { fail(e); if (undo) undo(e); }).finally(() => { PENDN--; syncShow(); });
}
window.addEventListener('beforeunload', e => { if (PENDN) { e.preventDefault(); e.returnValue = ''; } });
// 作成直後のイベントへの書き込みは、作成の保存が終わってから送る
const CREATING = {};
const ready = id => CREATING[id] || Promise.resolve();
const cacheEv = () => cset('ev:' + S.ev.id, { ev: S.ev, contacts: S.contacts, total: S.total });
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
// プレゼン用のスマホ表示（パソコンだけで有効。端末に記憶）
const BIG = matchMedia('(min-width: 900px)').matches;
const PHONE = BIG && store.get('mw_phone') === '1';
if (PHONE) document.body.classList.add('phone');
const WIDE = () => !PHONE && matchMedia('(min-width: 900px)').matches;
function phoneMode(on) { store.set('mw_phone', on ? '1' : ''); location.reload(); }
// 読み込みに失敗したとき、真っ白にせず「もう一度」を出す
const oops = (e, retry) => view(`<main><p class="err" style="font-size:14px">${esc(e.message || e)}</p><button class="btn2" onclick="${retry}">もう一度読み込む</button></main>`);
const STATUS = { draft: '未承認', approved: '予約済', sent: '送信済' };
const sendDay = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes() < 390 ? '今日' : '明日'; };
// アイコン（線画。24pxの枠）
const svg = (d, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC = {
  back: '<path d="M15 4 7 12l8 8"/>',
  home: '<path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  leads: '<path d="M10 6h10M10 12h10M10 18h10"/><path d="m3 6 1.5 1.500L7 5M3 12l1.5 1.500L7 11M3 18l1.5 1.500L7 17"/>',
  people: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3-5.5 6.5-5.500s6 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17.5 14.500c2.2 0 3.7 1.5 4 4"/>',
  camera: '<path d="M4 8h3l1.5-2.500h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>',
  check: '<path d="m5 12.5 4.5 4.500L19 7"/>',
  pencil: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
};
// 画面の左端から右へスワイプすると、前の画面に戻る（iOS と同じ操作）。戻る先は左上の「＜」と同じ
(() => {
  let x0 = null, y0 = 0, dx = 0, t0 = 0, back = null, on = false;
  const app = () => $('#app');
  addEventListener('touchstart', e => {
    const t = e.touches[0];
    back = document.querySelector('header .icon[aria-label="戻る"]');
    if (t.clientX > 40 || !back || back.style.visibility === 'hidden') { x0 = null; return; }
    x0 = t.clientX; y0 = t.clientY; dx = 0; t0 = Date.now(); on = false;
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (x0 == null) return;
    const t = e.touches[0]; dx = Math.max(0, t.clientX - x0);
    if (!on && Math.abs(t.clientY - y0) > dx) { x0 = null; return; } // 縦のスクロールなら何もしない
    if (dx > 8) { on = true; app().className += ' edge'; app().style.transform = `translateX(${dx}px)`; }
  }, { passive: true });
  addEventListener('touchend', () => {
    if (x0 == null || !on) { x0 = null; return; }
    const a = app(), fast = dx / (Date.now() - t0) > 0.5, go = dx > innerWidth * 0.35 || (fast && dx > 40);
    a.classList.remove('edge'); a.classList.add('edgeback');
    a.style.transform = go ? `translateX(${innerWidth}px)` : '';
    setTimeout(() => { a.classList.remove('edgeback'); a.style.transform = ''; if (go) { haptic(); back.click(); } }, 280);
    x0 = null;
  });
})();
// テーマカラー（iOS のシステムカラーから選ぶ。端末に記憶）
const THEMES = [['blue', '青', '#007AFF', '#0A84FF'], ['indigo', 'インディゴ', '#5856D6', '#5E5CE6'], ['purple', '紫', '#AF52DE', '#BF5AF2'], ['pink', 'ピンク', '#FF2D55', '#FF375F'],
  ['red', '赤', '#FF3B30', '#FF453A'], ['orange', 'オレンジ', '#FF9500', '#FF9F0A'], ['green', '緑', '#34C759', '#30D158'], ['teal', 'ティール', '#30B0C7', '#40C8E0'], ['graphite', 'グラファイト', '#8E8E93', '#98989D']];
function applyTheme(k) {
  const t = THEMES.find(x => x[0] === k) || THEMES[0], dark = matchMedia('(prefers-color-scheme: dark)').matches, c = dark ? t[3] : t[2];
  const r = document.documentElement.style;
  r.setProperty('--tint', c); r.setProperty('--tintbg', c + (dark ? '33' : '1F'));
}
applyTheme(store.get('mw_theme'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(store.get('mw_theme')));
function setTheme(k) { store.set('mw_theme', k === 'blue' ? '' : k); applyTheme(k); haptic(); document.querySelectorAll('.sw-c').forEach(b => b.classList.toggle('on', b.dataset.k === k)); }
// 軽い振動（Android は vibrate、iPhone は見えないスイッチを切り替えて触覚を出す）
const HAP = (() => { const l = document.createElement('label'), i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); l.style.display = 'none'; l.appendChild(i); document.body.appendChild(l); return l; })();
const haptic = () => { try { navigator.vibrate ? navigator.vibrate(8) : HAP.click(); } catch (e) {} };
// 最上位の画面：大きなタイトルと、下に浮かぶタブバー
const large = (t, s, right = '') => `<div class="lt"><div>${s ? `<small>${esc(s)}</small>` : ''}<h1>${esc(t)}</h1></div>${right}</div>`;
const tabs = on => `<nav class="tabs" aria-label="メニュー">${[['home', 'ホーム', 'home()'], ['leads', 'リード', 'leads()'], ['people', '相手一覧', 'contacts()']]
  .map(([k, t, fn]) => `<button class="${k === on ? 'on' : ''}" ${k === on ? 'aria-current="page"' : ''} onclick="haptic();${fn}">${svg(IC[k])}${t}</button>`).join('')}</nav>`;
const head = (t, s, back) => `<header><button class="icon" aria-label="戻る" onclick="haptic();${back || ''}" ${back ? '' : 'style="visibility:hidden"'}>${svg(IC.back, 2.6)}<span class="bk">戻る</span></button><div class="t">${esc(t)}${s ? `<div class="s">${esc(s)}</div>` : ''}</div><span style="width:44px"></span></header>`;

// ───── ホーム ─────
// ───── ログイン（名前を選んで暗証番号。この端末に記憶） ─────
async function login() {
  if (K) cclear();
  store.set('mw_k', ''); K = '';
  const code = store.get('mw_c');
  if (!code) return teamCode();
  view('<main><p class="note">読み込み中…</p></main>');
  let names;
  try { names = await call('api_names', code); }
  catch (e) { if (/チームコード/.test(e.message)) { store.set('mw_c', ''); return teamCode(e.message); } return oops(e, 'login()'); }
  view(head('MW Desk') + `<main>
    <div class="h2">あなたはどなたですか？</div>
    ${names.map(n => `<button class="item" onclick="pick(this.textContent)">${esc(n)}</button>`).join('')}
  </main>`);
}
async function pick(name) {
  try {
    K = (await call('api_login', name, store.get('mw_c'))).token;
    store.set('mw_k', K);
    home();
  } catch (e) { fail(e); }
}
// 端末ごとに最初の1回だけ、チーム共通コードを入れる
function teamCode(msg = '') {
  view(head('MW Desk') + `<main>
    <div><label for="tc" class="req">チームコード</label><input id="tc" type="password" autocomplete="off" aria-required="true"></div>
    <span class="note" style="text-align:left">この端末では最初の1回だけです。コードはメンバー内で共有されています</span>
    ${msg ? `<span class="err">${esc(msg)}</span>` : ''}
  </main><div class="foot"><button class="btn" id="go">次へ</button></div>`);
  const go = () => { const v = $('#tc').value.trim(); if (!v) return; store.set('mw_c', v); login(); };
  $('#go').onclick = go;
  $('#tc').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#tc').focus();
}

async function home() {
  if (!K) return login();
  if (WIDE()) return dashboard();
  const v = await swr('home', 'api_init', [], d => { Object.assign(S, d); renderHome(); }, e => K && oops(e, 'home()'));
  if (v) prefetch(v.events);
}
// よく開く上位のイベントを裏で読んでおき、タップした瞬間に開けるようにする
function prefetch(evs) {
  (evs || []).slice(0, 3).forEach((e, i) => setTimeout(() => run('api_getEvent', e.id).then(d => cset('ev:' + e.id, d)).catch(() => {}), 400 * (i + 1)));
}
// 承認待ちのあるイベントへ（1つならそのまま開く）
function goDrafts() {
  const ids = Object.keys(S.sum ? S.sum.draftsBy : {});
  if (!ids.length) return toast('承認待ちはありません');
  openEvent(ids[0]);
}
function renderHome() {
  const sum = S.sum;
  const d = new Date();
  view(large('MW Desk', `${d.getMonth() + 1}月${d.getDate()}日 ${'日月火水木金土'[d.getDay()]}曜日`, `<button class="avatar" aria-label="設定（${esc(S.me)}）" onclick="settings()">${esc((S.me || '?')[0])}</button>`) + `<main>
    <button class="btn" onclick="newEvent()">＋ イベント作成</button>
    <div class="row">
      <button class="stat ${sum.drafts ? 'hot' : ''}" onclick="goDrafts()"><span>承認待ち</span><b>${sum.drafts}</b><small>件</small></button>
      <button class="stat ${sum.actions.length ? 'hot' : ''}" onclick="$('#todo') ? $('#todo').scrollIntoView({ behavior: 'smooth', block: 'start' }) : toast('期限が近いものはありません')"><span>期限が近い</span><b>${sum.actions.length}</b><small>件</small></button>
    </div>
    ${sum.actions.length ? `<section class="todo" id="todo"><h3>次にやること<small>7日以内・期限切れ</small></h3>${sum.actions.map(a => `<div class="titem"><span class="due ${a.late ? 'late' : ''}">${a.late ? '期限切れ' : a.due ? esc(a.due.slice(5).replace('-', '/')) + 'まで' : '期限なし'}</span><span class="tbody" onclick="contact('${a.id}')"><b>${esc(a.next)}</b>${esc(a.company)} ${esc(a.name)}</span><button onclick="actDone('${a.id}')">済にする</button></div>`).join('')}</section>` : ''}
    <div class="h2">自分のイベント</div>
    ${S.events.map(e => `<button class="item" onclick="openEvent('${e.id}')">${esc(e.name)}${sum.draftsBy[e.id] ? ` <span class="tag k">承認待ち ${sum.draftsBy[e.id]}</span>` : ''}<small>${jpDate(e.date)}・${esc(e.members.join('、'))}</small></button>`).join('') || '<p class="note">まだありません</p>'}
  ${ver()}</main>${tabs('home')}`);
}
function actDone(id) {
  const before = S.sum.actions;
  S.sum.actions = before.filter(a => a.id !== id);
  renderHome(); toast('済にしました');
  bg(run('api_actionDone', id).then(sum => { S.sum = sum; cset('home', { me: S.me, members: S.members, events: S.events, sum }); }),
    () => { S.sum.actions = before; renderHome(); });
}

// ───── PC用：上のメニューとダッシュボード ─────
function bar(on) {
  const b = (k, t, fn) => `<button class="${on === k ? 'on' : ''}" onclick="${fn}">${t}</button>`;
  return `<nav class="bar"><b>MW Desk <small class="note">${esc(S.me)}</small></b>
    ${b('dash', 'ダッシュボード', 'home()')}${b('leads', 'リード管理', 'leads()')}${b('contacts', '相手一覧', 'contacts()')}${b('settings', '設定', 'settings()')}
    ${S.lead ? `<a href="${esc(S.lead)}" target="_blank" rel="noopener">リード表 ↗</a>` : ''}
    <button onclick="phoneMode(true)">📱 スマホ表示</button><button onclick="login()">切り替え</button><button class="new" onclick="newEvent()">＋ イベント作成</button></nav>`;
}
async function dashboard() {
  const v = await swr('dash', 'api_dashboard', [], renderDash, e => K && oops(e, 'home()'), true);
  if (v) prefetch(v.home.events);
}
function renderDash(d) {
  Object.assign(S, d.home); S.lead = d.lead;
  const k = d.kpi, judge = j => j ? `<span class="pillc ${{ 達成: 'ok', 一部達成: 'mid', 未達: 'ng' }[j]}">${j}</span>` : '<span class="note">—</span>';
  const tile = (t, v, u) => `<div class="stat"><span>${t}</span><b>${v}</b><small>${u}</small></div>`;
  view(bar('dash') + `<div class="dash">
    ${d.errors.length ? `<div class="alert">送信できなかったメールが ${d.errors.length}件あります（翌朝もう一度送ります）：${d.errors.map(e => `${esc(e.company)} ${esc(e.name)}（担当 ${esc(e.by)}）`).join('、')}</div>` : ''}

// ───── リード管理（パソコン：一覧で直接更新 ／ スマホ：見るだけ） ─────
const NEXTS = ['アポ打診', '紹介', '資料送付', 'その他', 'なし'];
const LF = { q: '', by: '', show: 'todo' }; // 絞り込み（画面を移っても覚えておく）
function leads() {
  const wide = WIDE();
  view((wide ? bar('leads') : large('リード', '次にやることの一覧')) + `<main${wide ? ' class="dash"' : ''}>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="lq" type="search" placeholder="社名・氏名・イベントで検索" value="${esc(LF.q)}" aria-label="検索" style="flex:2;min-width:200px">
      <select id="lby" aria-label="担当" style="flex:1;min-width:120px"><option value="">担当：全員</option>${S.members.map(m => `<option ${LF.by === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select>
      <select id="lshow" aria-label="表示" style="flex:1;min-width:140px">${[['todo', '要対応'], ['late', '期限切れ'], ['done', '済'], ['all', 'すべて']].map(([v, t]) => `<option value="${v}" ${LF.show === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
    </div>
    <div id="lsum" class="note" style="text-align:left"></div>
    <div id="llist"><p class="note">読み込み中…</p></div></main>${wide ? '' : tabs('leads')}`, wide);
  const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  let all = cget('leads') || null;
  const paint = () => {
    if (!$('#llist') || !all) return;
    const w = LF.q.toLowerCase().split(/\s+/).filter(Boolean);
    const late = l => !l.nextDone && l.next !== 'なし' && l.due && l.due < today;
    const ls = all.filter(l => (!LF.by || l.by === LF.by)
      && ({ todo: !l.nextDone && l.next !== 'なし', late: late(l), done: l.nextDone, all: true })[LF.show]
      && w.every(x => `${l.company} ${l.name} ${l.event} ${l.hot}`.toLowerCase().includes(x)))
      .sort((a, b) => (a.due || '9').localeCompare(b.due || '9') || b.date.localeCompare(a.date));
    $('#lsum').textContent = `${ls.length}件（期限切れ ${all.filter(late).length}件）`;
    const dueTag = l => l.nextDone ? '<span class="pillc gray">済</span>' : late(l) ? `<span class="pillc ng">${esc(l.due.slice(5).replace('-', '/'))} 期限切れ</span>` : l.due ? `<span class="pillc mid">${esc(l.due.slice(5).replace('-', '/'))}まで</span>` : '';
    $('#llist').innerHTML = !ls.length ? '<p class="note">該当するリードはありません</p>' : wide
      ? `<div class="panel"><table class="t"><tr><th>済</th><th>期限</th><th>次にやること</th><th>相手</th><th>担当</th><th>状態</th><th>区分</th><th>熱い理由</th><th>イベント</th></tr>${ls.map(l => `<tr data-l="${l.id}" style="${l.nextDone ? 'opacity:.5' : ''}">
          <td><input type="checkbox" class="ldone" ${l.nextDone ? 'checked' : ''} aria-label="済"></td>
          <td><input type="date" class="ldue" value="${esc(l.due)}" aria-label="期限" style="height:36px;min-width:150px;font-size:14px;padding:0 10px;${late(l) ? 'color:var(--red)' : ''}"></td>
          <td><select class="lnext" aria-label="次にやること" style="height:36px;font-size:14px;padding:0 30px 0 10px;min-width:120px">${NEXTS.map(n => `<option ${n === l.next ? 'selected' : ''}>${n}</option>`).join('')}</select></td>
          <td><a href="#" onclick="contact('${l.id}');return false" style="color:inherit;text-decoration:none"><b>${esc(l.company || '社名未読取')}</b><br>${esc(l.name)}</a></td>
          <td>${esc(l.by)}</td><td>${STATUS[l.status] || ''}</td><td>${esc(l.target)}</td>
          <td><input class="lhot" value="${esc(l.hot)}" placeholder="—" aria-label="熱い理由" style="height:36px;min-width:180px;font-size:14px;padding:0 10px"></td>
          <td>${esc(l.event)}<br><small class="note">${esc(l.date)}</small></td></tr>`).join('')}</table></div>`
      : ls.map(l => `<button class="item" onclick="contact('${l.id}')">${esc(l.company || '社名未読取')} ${esc(l.name)} ${dueTag(l)}<small>${esc(l.next)}・担当 ${esc(l.by)}・${esc(l.event)}</small></button>`).join('');
    if (!wide) return;
    // その場で更新（押した瞬間に画面へ反映し、保存は裏で）
    const upd = (tr, patch) => {
      const l = all.find(x => x.id === tr.dataset.l), before = Object.assign({}, l);
      Object.assign(l, patch); cset('leads', all); paint();
      bg(run('api_updateLead', l.id, patch), () => { Object.assign(l, before); paint(); });
    };
    document.querySelectorAll('#llist tr[data-l]').forEach(tr => {
      tr.querySelector('.ldone').onchange = e => upd(tr, { nextDone: e.target.checked });
      tr.querySelector('.ldue').onchange = e => upd(tr, { due: e.target.value });
      tr.querySelector('.lnext').onchange = e => upd(tr, { next: e.target.value });
      tr.querySelector('.lhot').onchange = e => upd(tr, { hot: e.target.value.trim() });
    });
  };
  let t; $('#lq').oninput = () => { clearTimeout(t); t = setTimeout(() => { LF.q = $('#lq').value; paint(); }, 200); };
  $('#lby').onchange = () => { LF.by = $('#lby').value; paint(); };
  $('#lshow').onchange = () => { LF.show = $('#lshow').value; paint(); };
  paint();
  run('api_leads').then(ls => { all = ls; cset('leads', ls); if (!busy()) paint(); }).catch(e => { if (!all) oops(e, 'leads()'); });
}

async function contacts(q = '') {

  view((wide ? bar('contacts') : large('相手一覧', 'チーム全員分')) + `<main${wide ? ' class="dash"' : ''}>

  const paint = cs => {
      if (!$('#list')) return;
      $('#list').innerHTML = !cs.length ? '<p class="note">見つかりません</p>' : wide
        ? `<div class="panel"><table class="t"><tr><th>社名</th><th>氏名</th><th>部署</th><th>イベント</th><th>日付</th><th>担当</th><th>メール</th></tr>${cs.map(c => `<tr class="go" onclick="contact('${c.id}')"><td>${esc(c.company || '社名未読取')}</td><td>${esc(c.name)}</td><td>${esc(c.dept)}</td><td>${esc(c.event)}</td><td>${esc(c.date)}</td><td>${esc(c.by)}</td><td><span class="pillc ${{ draft: 'gray', approved: 'mid', sent: 'ok' }[c.status]}">${STATUS[c.status] || ''}</span></td></tr>`).join('')}</table></div>`

    <div class="add"><input id="memo" placeholder="メモを追加（キーボードのマイクで話せます）"><button id="addm">追加</button></div>
  </main><div class="foot">
    <span class="note">${drafts ? `未承認 ${drafts}人。会場メモ ${ev.memos.length}件をもとに、残りを話して仕上げます` : '名刺を取り込むと次に進めます'}</span>
    <button class="btn" ${drafts ? '' : 'disabled'} onclick="talk()">まとめて話して仕上げる</button></div>`, false, keepScroll);
  // 左にスワイプで「削除」ボタンを出す（スワイプだけでは消えない）
  document.querySelectorAll('.memo[data-j], .crow').forEach(row => {
    let x0 = null, dx = 0;
    const del = row.parentNode.querySelector('.mdel');
    row.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; dx = 0; row.style.transition = 'none'; if (del) del.style.visibility = 'visible'; }, { passive: true });
    row.addEventListener('touchmove', e => { if (x0 == null) return; dx = Math.min(0, e.touches[0].clientX - x0); row.style.transform = `translateX(${Math.max(dx, -96)}px)`; }, { passive: true });
    row.addEventListener('touchend', () => { row.style.transition = ''; x0 = null; const open = dx < -48; row.style.transform = open ? 'translateX(-80px)' : ''; if (del && !open) setTimeout(() => { if (!row.style.transform) del.style.visibility = 'hidden'; }, 250); });

  return upBusy(id)
    ? `<i class="spin" role="progressbar" aria-label="読み取り中"></i><span><b>AIが名刺を読み取っています</b><br><small>${st.done} / ${st.total}枚 完了・このまま操作を続けられます</small><div class="prog"><i style="width:${Math.max(6, 100 * st.done / (st.total || 1))}%"></i></div></span>`
    : `${svg(IC.camera, 1.7)}<span>名刺と写真をまとめて選ぶ<br><small>名刺か写真かは AI が見分けます</small></span>`;
};
const upRow = u => u.st === 'ng'
  ? `<div class="line crow up-ng" id="u${u.n}" onclick="retryUp(${u.n})"><img class="th" src="${u.url}" alt=""><span class="cn">送れませんでした（タップで再送）</span><span class="tag">失敗</span></div>`
  : `<div class="line crow up-run" id="u${u.n}"><img class="th" src="${u.url}" alt=""><span class="cn" aria-label="AIが読み取り中"><span class="shim"></span></span><span class="tag">読取中</span></div>`;
function enqueue(id, files) {
  const q = UPQ[id] = UPQ[id] || [];
  files.forEach(f => q.push({ n: ++UPN, f, url: URL.createObjectURL(f), st: 'wait' }));
  const st = UPS[id] = UPS[id] || { total: 0, done: 0 }; st.total += files.length;
  UPLOADING = true; refreshUp(id, true);
  for (let w = UPWORK; w < 3; w++) upWorker(id); // 3枚ずつ同時に送る（AI無料枠の回数制限に当たりにくい数）
}
async function upWorker(id) {
  UPWORK++;
  await ready(id);
  for (let u; (u = (UPQ[id] || []).find(x => x.st === 'wait'));) {
    u.st = 'run';
    try {
      const img = await toB64(u.f);
      const r = await run('api_upload', id, img.b64, img.mime);
      UPQ[id] = UPQ[id].filter(x => x !== u); UPS[id].done++; haptic();
      if (r.type === 'photo') { if (S.ev && S.ev.id === id) S.ev.photos++; toast('会場写真として保存しました', 1500); }
      else if (S.ev && S.ev.id === id) S.contacts.push(r);
      cacheEv(); refreshUp(id, false, u, r);
    } catch (err) { u.st = 'ng'; u.err = err.message || String(err); UPS[id].done++; refreshUp(id, false, u); }
  }
  if (--UPWORK === 0) { UPLOADING = false; UPS[id] = { total: 0, done: 0 }; const ng = (UPQ[id] || []).length; toast(ng ? `${ng}枚 送れませんでした。行をタップで再送できます` : '取り込みが終わりました', 3000); if (S.ev && S.ev.id === id && !busy()) renderEvent(true); }
}
function retryUp(n) {
  const id = S.ev.id, u = (UPQ[id] || []).find(x => x.n === n); if (!u) return;
  UPQ[id] = UPQ[id].filter(x => x !== u); enqueue(id, [u.f]);
}
// 画面全体は描き直さず、その行と見出しだけを差し替える（打ちかけのメモが消えないように）
function refreshUp(id, added, u, r) {
  if (!S.ev || S.ev.id !== id || !$('#cards')) return;
  $('#dropt').innerHTML = upLabel(id); $('#dropt').classList.toggle('busy', upBusy(id));
  if (added) { const box = $('#cards'); [...UPQ[id]].reverse().forEach(x => { if (!$('#u' + x.n)) box.insertAdjacentHTML('afterbegin', upRow(x)); }); return; }
  const row = u && $('#u' + u.n); if (!row) return;
  if (!r) { row.outerHTML = upRow(u); return; }
  if (r.type === 'photo') { row.remove(); return; }
  row.outerHTML = `<div class="mrow"><button class="mdel" onclick="delCard('${r.id}')">削除</button><div class="line crow up-done" data-c="${r.id}" onclick="openCard('${r.id}')">${thumb(r, 'th')}<span class="cn">${esc(r.company || '社名未読取')} ${esc(r.name)}</span><span class="tag">${STATUS[r.status]}</span></div></div>`;
}

// 送る前に縮小（長辺1280px）して通信量とAIの負担を減らす
async function toB64(file) {
  try {
    const img = await createImageBitmap(file);
    const r = Math.min(1, 1024 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = img.width * r; c.height = img.height * r;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return { b64: c.toDataURL('image/jpeg', 0.8).split(',')[1], mime: 'image/jpeg' };
  } catch (e) {
    // このブラウザで開けない形式（HEICなど）はそのまま送る。AIもDriveもHEICを扱える
    if (file.size > 15e6) throw new Error('画像が大きすぎます（15MBまで）');
    const b64 = await new Promise((ok, ng) => { const fr = new FileReader(); fr.onload = () => ok(fr.result.split(',')[1]); fr.onerror = ng; fr.readAsDataURL(file); });
    const heic = /\.hei[cf]$/i.test(file.name) || /hei[cf]/.test(file.type);
    return { b64, mime: heic ? 'image/heic' : (file.type || 'image/jpeg') };
  }
}

      <span class="note">← 直す　　右にスワイプで承認 →</span></div>`);
  window.C = c;
  // 横にはっきり動かしたときだけスワイプとみなす（縦スクロール中の誤承認を防ぐ）。入力欄の上では反応しない
  const card = $('#card'); let x0 = null, y0 = 0, dx = 0, dy = 0;
  card.addEventListener('touchstart', e => { if (e.target.closest('input,textarea,select,button') || e.touches[0].clientX < 40) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = dy = 0; card.style.transition = 'none'; }, { passive: true });
  card.addEventListener('touchmove', e => { if (x0 == null) return; dx = e.touches[0].clientX - x0; dy = e.touches[0].clientY - y0; if (Math.abs(dx) > Math.abs(dy)) card.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`; }, { passive: true });
  card.addEventListener('touchend', () => {
    if (x0 == null) return;
    card.style.transition = ''; x0 = null;
    const sideways = Math.abs(dx) > 2 * Math.abs(dy);
    if (sideways && dx > 110) approve(); else if (sideways && dx < -110) { card.style.transform = ''; edit(); } else card.style.transform = '';
  });
}

async function saveC(patch) {
  try {
    const c = await run('api_updateContact', Object.assign({ id: C.id }, patch));
    S.contacts = S.contacts.map(x => x.id === c.id ? c : x);
  } catch (e) { fail(e); }
}
async function setSched(m) { await saveC({ schedMode: m }); swipe(); }
async function setDate() {
  const raw = [...document.querySelectorAll('[data-j]')].map(i => i.value);
  const fmt = v => { const d = new Date(v), e = new Date(d.getTime() + 30 * 6e4), hm = x => `${x.getHours()}:${String(x.getMinutes()).padStart(2, '0')}`;
    return `${d.getMonth() + 1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）${hm(d)}〜${hm(e)}`; };
  await saveC({ dates: raw.filter(Boolean).map(fmt), dtRaw: raw });
  swipe();
}

const PEND = [];
async function approve() {
  haptic();
  const c = C, card = $('#card');
  const err = !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email || '') ? 'メールアドレスを確認してください'
    : /〇/.test(c.subject + c.body) ? '「〇〇」が残っています。直してから承認してください' : '';
  if (err) { if (card) card.style.transform = ''; return fail(new Error(err)); }
  c.status = 'approved'; cacheEv();
  const p = run('api_approve', c.id).catch(e => { c.status = 'draft'; fail(e); if ($('#card') || $('.big')) swipe(); });
  PEND.push(p);
  if (card) { card.style.transform = 'translateX(120%) rotate(12deg)'; await new Promise(r => setTimeout(r, 160)); }
  swipe();
}

// ───── 直す ─────
let BACK = swipe; // 「直す」から戻る先（承認カード or イベント画面）
function edit() {
  const c = C, sc = Object.keys(SCENE), bl = BLOCKS[c.scene] || {};
  view(head('直す', c.company + ' ' + c.name, 'BACK()') + `<main>
    ${c.fileKey ? `${thumb(c, 'cardimg')}<button class="btn2" id="rr" onclick="reread()">AIでもう一度読み取る</button>` : ''}
    <div class="row"><div><label for="sc">シーン</label><select id="sc">${sc.map(s => `<option value="${s}" ${s === c.scene ? 'selected' : ''}>${SCENE[s]}</option>`).join('')}</select></div>
      <div><label for="bl">ブロック</label><select id="bl" ${Object.keys(bl).length ? '' : 'disabled'}><option value="">—</option>${Object.entries(bl).map(([k, v]) => `<option value="${k}" ${k === c.block ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
    <div><label for="co">社名</label><input id="co" value="${esc(c.company)}"></div>
    <div><label for="dp">部署</label><input id="dp" value="${esc(c.dept)}"></div>
    <div class="row"><div><label for="nm">氏名</label><input id="nm" value="${esc(c.name)}"></div><div><label for="ti">役職</label><input id="ti" value="${esc(c.title)}"></div></div>
    <div><label for="em" class="req">メールアドレス</label><input id="em" type="email" value="${esc(c.email)}"></div>
    <div><label for="sj">件名</label><input id="sj" value="${esc(c.subject)}"></div>
    <div><label for="bd">本文（直接直すと、以後は自動で組み直しません）</label><textarea id="bd" style="min-height:420px">${esc(c.body)}</textarea></div>
  </main><div class="foot"><button class="btn" id="sv">保存して戻る</button></div>`);
  let touched = !!c.edited;
  $('#sj').oninput = $('#bd').oninput = () => touched = true;
  $('#sc').onchange = () => { C.scene = $('#sc').value; C.block = ''; saveFields(false).then(edit); };
  $('#bl').onchange = () => { C.block = $('#bl').value; saveFields(false).then(edit); };
  $('#sv').onclick = () => saveFields(touched).then(() => BACK());
}
function saveFields(edited) {
  return saveC({ scene: C.scene, block: C.block, company: $('#co').value, name: $('#nm').value, dept: $('#dp').value, title: $('#ti').value,
    email: $('#em').value.trim(), subject: $('#sj').value, body: $('#bd').value, edited })
    .then(() => { C = S.contacts.find(x => x.id === C.id); });
}

// ───── 送信予約の完了 ─────
function done() {
  const ev = S.ev, ap = S.contacts.filter(c => c.status === 'approved'), sent = S.contacts.filter(c => c.status === 'sent');
  if (PEND.length) Promise.allSettled(PEND.splice(0)).then(() => run('api_organizeSoon').catch(() => {}));
  const by = {}; ap.forEach(c => by[c.scene] = (by[c.scene] || 0) + 1);
  view(head(ev.name, '', `openEvent('${ev.id}')`) + `<main>
    <div><span class="note" style="text-align:left;display:block">${sendDay()} 6:30 に送信します</span>
      <p style="margin:4px 0"><span class="big">${ap.length}</span> <b>件のメールを予約しました</b></p>
      <span class="note" style="text-align:left;display:block">送信前ならいつでも取り消し・修正できます</span></div>
    <div><div class="h2">内訳</div>${Object.keys(by).sort().map(s => `<div class="line"><span>${SCENE[s]}</span><span>${by[s]}</span></div>`).join('')}</div>
    <div><div class="h2">予約中</div>${ap.map(c => `<div class="line"><span>${esc(c.company)} ${esc(c.name)}</span><button onclick="cancelC('${c.id}')">取り消して直す</button></div>`).join('')}</div>
    ${sent.length ? `<span class="note">送信済み ${sent.length}件</span>` : ''}
    <span class="note">名刺 ${S.contacts.length}枚・写真 ${ev.photos}枚は、まもなく Drive のイベントフォルダに整理されます</span>
  </main><div class="foot"><button class="btn" onclick="report()">終了報告を仕上げる</button><button class="btn2" onclick="home()">ホームへ</button></div>`);
}
function cancelC(id) {
  const c = S.contacts.find(x => x.id === id);
  c.status = 'draft'; cacheEv(); swipe();
  bg(run('api_cancel', id), () => { c.status = 'approved'; });
}

home();
</script>
</body>
</html>
